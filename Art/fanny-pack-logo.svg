<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="244" r="200"/>
    </clipPath>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2F5E6B"/>
      <stop offset="1" stop-color="#152C33"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7FD1C0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7FD1C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge: Pocket Goblin's gold ring around a teal disc -->
  <circle cx="256" cy="256" r="250" fill="#5A2D14"/>
  <circle cx="256" cy="256" r="242" fill="#EFB03D"/>
  <circle cx="256" cy="256" r="216" fill="#5A2D14"/>
  <circle cx="256" cy="256" r="208" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#EFB03D" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Soft glow behind the pack -->
  <circle cx="256" cy="250" r="170" fill="url(#glow)"/>

  <g stroke="#290C03" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 12)">

    <!-- Belt strap and buckle, behind the pack -->
    <g clip-path="url(#disc)">
      <path d="M40 272 Q256 316 472 272 L472 308 Q256 352 40 308 Z" fill="#D08A42"/>
      <path d="M40 290 Q256 334 472 290" fill="none" stroke="#EFB03D" stroke-width="3" stroke-dasharray="10 9"/>
    </g>
    <rect x="66" y="274" width="32" height="48" rx="7" fill="#EFB03D"/>
    <rect x="76" y="285" width="12" height="26" rx="3" fill="#5A2D14" stroke-width="4"/>

    <g transform="translate(256 300) scale(1.12) translate(-256 -300)">
    <!-- Back of the pouch and its open zipper -->
    <path d="M140 254 Q256 228 372 254 Q394 316 352 370 Q256 418 160 370 Q118 316 140 254 Z" fill="#5FB48E"/>
    <path d="M148 256 Q256 222 364 256 Q256 280 148 256 Z" fill="#290C03"/>

    <!-- Drumstick -->
    <g transform="translate(332 200) rotate(28)">
      <circle cx="-9" cy="-70" r="11" fill="#FEFEFD"/>
      <circle cx="9" cy="-70" r="11" fill="#FEFEFD"/>
      <rect x="-8" y="-68" width="16" height="50" fill="#FEFEFD"/>
      <path d="M-32 30 C-38 -6 -18 -26 0 -26 C18 -26 38 -6 32 30 L30 90 L-30 90 Z" fill="#B17230"/>
      <path d="M-20 4 C-20 -10 -10 -16 -2 -16" fill="none" stroke="#E39C35" stroke-width="7"/>
    </g>

    <!-- Bandage roll -->
    <g transform="rotate(-22 196 222)">
      <rect x="162" y="150" width="68" height="132" rx="10" fill="#FEFEFD"/>
      <g fill="none" stroke="#DCD4A2" stroke-width="4">
        <path d="M168 196 H224"/>
        <path d="M168 220 H224"/>
        <path d="M168 244 H224"/>
      </g>
      <ellipse cx="196" cy="152" rx="34" ry="12" fill="#F3EBD3"/>
      <ellipse cx="196" cy="152" rx="10" ry="4" fill="#5A2D14" stroke-width="3"/>
    </g>

    <!-- Health potion -->
    <g transform="rotate(8 262 236)">
      <rect x="250" y="166" width="24" height="40" fill="#F3EBD3"/>
      <rect x="245" y="148" width="34" height="24" rx="5" fill="#B17230"/>
      <circle cx="262" cy="240" r="40" fill="#D2493B"/>
      <path d="M238 226 C240 214 248 206 258 204" fill="none" stroke="#FEFEFD" stroke-width="7"/>
    </g>

    <!-- Front of the pouch, covering what sits inside -->
    <path d="M146 256 Q256 278 366 256 Q394 316 352 370 Q256 418 160 370 Q118 316 146 256 Z" fill="#5FB48E"/>
    <path d="M150 262 Q256 284 362 262" fill="none" stroke="#EFB03D" stroke-width="4" stroke-dasharray="4 6" stroke-linecap="butt"/>

    <!-- Front pocket with its own zipper -->
    <path d="M172 314 Q256 300 340 314 Q338 356 316 374 Q256 398 196 374 Q174 356 172 314 Z" fill="#4A9A76"/>
    <path d="M180 318 Q256 306 332 318" fill="none" stroke="#EFB03D" stroke-width="4" stroke-dasharray="4 6" stroke-linecap="butt"/>
    <path d="M318 316 L326 346 L312 348 Z" fill="#EFB03D" stroke-width="5"/>

    <!-- Main zipper pull -->
    <path d="M354 262 L370 290 L356 296 Z" fill="#EFB03D" stroke-width="5"/>
    </g>

  </g>
</svg>
